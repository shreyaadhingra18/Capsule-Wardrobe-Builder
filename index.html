<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capsule Wardrobe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="main">
      <h1 class="title"> CAPSULE WARDROBE</h1>
      <p class="subtitle">What you own, sorted by what today calls for.</p>
        </div>

  </header>

  <section id="weather-box">
    <p id="weather-text">Loading weather...</p>
  </section>
  <section class="navbar">
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="wardrobe.html">Wardrobe</a></li>
        <li><a href="outfit.html">Outfits</a></li>
        <li><a href="settings.html">Settings</a></li>
      </ul>
    </nav>
  </section>

  <section>
    <h2>Add an item</h2>
    <form id="item-form">
        <div class="form-group">
            <input type="text" id="item-name" placeholder="e.g. Blue jacket" required>
            <select id="item-category">
                <option value="top">Tops</option>
                <option value="shirt">Shirts</option>
                <option value="t-shirt">T-shirts</option>
                <option value="sweater">Sweaters</option>
                <option value="hoodies">Hoodies</option>
                <option value="jeans">Jeans</option>
                <option value="dresses">Dresses</option>
                <option value="outerwear">Outerwear</option>
                <option value="shoes">Shoes</option>
                <option value="heels">Heels </option>
            </select>
            <input type="color" id="item-color" value="#8899aa">
            <select id="item-warmth">
                <option value="light">Light ☀️</option>
                <option value="medium">Medium 🌤️</option>
                <option value="heavy">Heavy ❄️</option>
            </select>
            <input type="file" id="item-image" accept="image/*">
            <button type="submit">Add</button>
        </div>
    </form>
</section>
<section>
    <h2>Your wardrobe</h2>
    <div id="wardrobe-grid"></div>
  </section>
  <section>
    <h2> Today's Outfit ⭐</h2>
    <div id="suggested-outfit"></div>
    <div id="outfit-message"></div>
  </section>
  <script src="script.js"></script>
</body>
</html>
