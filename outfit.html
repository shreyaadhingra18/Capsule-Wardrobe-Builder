<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capsule Wardrobe | Outfits</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="outfit.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="outfit.js" defer></script>
</head>
<body>
<aside class="navbar">
    <h2 class="brand">Capsule</h2>
    <nav>
        <ul>
            <li>
                <a href="index.html">
                    <i data-lucide="house"></i>
                    <span>Home</span>
                </a>
            </li>
            <li>
                <a href="wardrobe.html">
                    <i data-lucide="shirt"></i>
                    <span>Wardrobe</span>
                </a>
            </li>
            <li>
                <a href="outfit.html" class="active">
                    <i data-lucide="sparkles"></i>
                    <span>Outfits</span>
                </a>
            </li>
        </ul>
    </nav>
    <div class="sidebar-footer">
        <i data-lucide="sparkles"></i>
        <span>Stay stylish,<br>every day!</span>
    </div>
</aside>

<main class="outfit-page">
    <header class="page-header">
        <div>
            <h1 class="title">My Outfits</h1>
            <p class="subtitle">Create, plan, and wear outfits from your wardrobe.</p>
        </div>
        <button class="create-outfit-btn" id="open-builder">
            <i data-lucide="plus"></i>
            <span>Create New Outfit</span>
        </button>
    </header>

    <section class="controls">
        <div class="tabs" aria-label="Outfit filters">
            <button class="tab active" data-filter="all">
                <i data-lucide="layout-grid"></i>
                <span>All</span>
            </button>
            <button class="tab" data-filter="favorites">
                <i data-lucide="heart"></i>
                <span>Favorites</span>
            </button>
            <button class="tab" data-filter="planned">
                <i data-lucide="calendar-days"></i>
                <span>Planned</span>
            </button>
        </div>

        <div class="search-box">
            <input type="text" id="search" placeholder="Search outfits...">
            <i data-lucide="search"></i>
        </div>

        <select id="sort">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="az">A to Z</option>
            <option value="favorites">Favorites</option>
        </select>
        <div class="view-buttons" aria-label="View options">
            <button class="view-btn active" type="button" aria-label="Grid view">
                <i data-lucide="grid-2x2"></i>
            </button>
            <button class="view-btn" type="button" aria-label="List view">
                <i data-lucide="list"></i>
            </button>
        </div>
    </section>

    <section class="outfit-builder hidden" id="outfit-builder">
        <div class="section-header">
            <h2 id="builder-title">Create Outfit</h2>
            <button class="icon-btn" id="close-builder" aria-label="Close outfit builder">
                <i data-lucide="x"></i>
            </button>
        </div>

        <form id="outfit-form">
            <div class="form-row">
                <input type="text" id="outfit-name" placeholder="Outfit name" required>
                <input type="date" id="outfit-date">
                <input type="number" id="outfit-temp" placeholder="Temp C">
            </div>
            <textarea id="outfit-description" placeholder="Short description"></textarea>

            <div class="builder-layout">
                <div>
                    <h3>Choose Items</h3>
                    <div class="picker-grid" id="wardrobe-picker"></div>
                </div>
                <div>
                    <h3>Selected Outfit</h3>
                    <div class="selected-grid" id="selected-items"></div>
                </div>
            </div>

            <div class="builder-actions">
                <button type="button" class="secondary-btn" id="clear-selection">Clear</button>
                <button type="submit" class="save-btn">Save Outfit</button>
            </div>
        </form>
    </section>

    <section class="today-outfit">
        <div class="section-header">
            <h2>
                <i data-lucide="sun"></i>
                Today's Outfit
            </h2>
            <button class="secondary-btn" id="clear-today">Clear</button>
        </div>
        <div class="today-card" id="today-card"></div>
    </section>

    <section class="all-outfits">
        <div class="section-header">
            <h2>All Outfits</h2>
            <p id="outfit-count">0 outfits</p>
        </div>
        <div class="outfit-grid" id="outfit-grid"></div>
    </section>

    <section class="ideas-section">
        <div class="section-header">
            <h2>
                <i data-lucide="sparkles"></i>
                Outfit Ideas
            </h2>
            <button class="secondary-btn" id="refresh-ideas">Refresh</button>
        </div>
        <div class="ideas-grid" id="ideas-grid"></div>
    </section>
</main>
</body>
</html>
