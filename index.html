<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capsule Wardrobe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Capsule Wardrobe</h1>
    <p>What you own, sorted by what today calls for.</p>
  </header>

  <section id="weather-box">
    <p id="weather-text">Loading weather...</p>
  </section>

  <section>
    <h2>Add an item</h2>
    <form id="item-form">
      <input type="text" id="item-name" placeholder="e.g. Blue jacket" required>
      <select id="item-category">
        <option value="top">Top</option>
        <option value="bottom">Bottom</option>
        <option value="shoes">Shoes</option>
      </select>
      <input type="color" id="item-color" value="#8899aa">
      <button type="submit">Add</button>
    </form>
  </section>

  <section>
    <h2>Your wardrobe</h2>
    <div id="wardrobe-grid"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
