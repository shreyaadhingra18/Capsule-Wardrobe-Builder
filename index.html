<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capsule Wardrobe</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<aside class="navbar">
    <div class="logo-icon">
        <i data-lucide="hanger"></i>
    </div>

    <nav>
        <ul>
            <li>
                <a href="index.html">
                    <i data-lucide="house"></i>
                    <span>Home</span>
                </a>
            </li>

            <li>
                <a href="wardrobe.html">
                    <i data-lucide="shirt"></i>
                    <span>Wardrobe</span>
                </a>
            </li>

            <li>
                <a href="outfit.html">
                    <i data-lucide="sparkles"></i>
                    <span>Outfits</span>
                </a>
            </li>

            <li>
                <a href="settings.html">
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </a>
            </li>
        </ul>
    </nav>
</aside>

<main class="dashboard">

    <div class="left-column">

        <header>
            <h1 class="title">CAPSULE WARDROBE</h1>
            <p class="subtitle">What you own, sorted by what today calls for.</p>
        </header>

        <section id="weather-box">
            <div class="weather-left">
                <i data-lucide="sun"></i>
                <div>
                    <h2 id="temperature">--°C</h2>
                    <p id="weather-text">Loading weather...</p>
                </div>
            </div>
        </section>

        <section class="add-item">
            <h2>Add an Item</h2>

            <form id="item-form">
                <input type="text" id="item-name" placeholder="e.g. Blue Jacket" required>

                <select id="item-category">
                    <option value="top">Top</option>
                    <option value="shirt">Shirt</option>
                    <option value="t-shirt">T-Shirt</option>
                    <option value="hoodie">Hoodie</option>
                    <option value="jeans">Jeans</option>
                    <option value="outerwear">Outerwear</option>
                    <option value="shoes">Shoes</option>
                </select>

                <input type="color" id="item-color" value="#8899aa">

                <select id="item-warmth">
                    <option value="light">Light ☀️</option>
                    <option value="medium">Medium 🌤️</option>
                    <option value="heavy">Heavy ❄️</option>
                </select>

                <input type="file" id="item-image" accept="image/*">

                <button type="submit">Add Item</button>
            </form>
        </section>

        <section class="wardrobe">
            <h2>Your Wardrobe</h2>
            <div id="wardrobe-grid"></div>
        </section>

    </div>

    <div class="right-column">

        <section class="today-outfit">
            <h2>Today's Outfit ⭐</h2>
            <div id="suggested-outfit"></div>
            <div id="outfit-message"></div>
        </section>

        <section class="overview">
            <h2>Wardrobe Overview</h2>

            <div class="stats">
                <div>Total Items</div>
                <div>Tops</div>
                <div>Bottoms</div>
                <div>Shoes</div>
            </div>
        </section>

        <section class="recent-items">
            <h2>Recently Added</h2>
            <div id="recent-grid"></div>
        </section>

    </div>

</main>

<script src="script.js"></script>

<script>
    lucide.createIcons();
</script>

</body>
</html>
